name: Verify Kind Cluster

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          whoami
          pwd
          docker version
          kind get clusters
          kubectl config current-context
          kubectl get nodes
          helm version